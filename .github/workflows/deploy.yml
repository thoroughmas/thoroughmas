name: Deploy Astro to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Astro 7.4.2+ hard-fails at runtime on Node < 22.23.4 (astro/bin/astro.mjs).
          # A bare "22.x" is not enough: setup-node reuses a version already in the
          # runner's tool cache when it satisfies the spec, and ubuntu-latest ships
          # 22.23.3 cached. A floor range excludes that, and check-latest makes
          # setup-node resolve against the current manifest instead of the cache.
          node-version: ">=22.23.4 <23"
          check-latest: true
      - uses: pnpm/action-setup@v3
        with:
          version: 11.12.0
      - name: Check toolchain
        run: |
          echo "node: $(node --version)"
          echo "node used by pnpm: $(pnpm exec node --version)"
          echo "pnpm: $(pnpm --version)"
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - name: Clean Cache
        run: |
          rm -rf .astro
          rm -rf node_modules/.vite
      - name: Install dependencies
        run: pnpm install
      - name: Debug File Existence
        run: |
          echo "Checking file existence"
          find . -name "ThomasStorm.jpg"
          ls -l src/assets/img/
      - name: Build site
        run: pnpm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
