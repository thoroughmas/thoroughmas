		let theme = 'dark';

		if (typeof localStorage !== 'undefined' && localStorage.getItem('theme')) {
			theme = localStorage.getItem('theme');
		}

		if (theme === 'light') {
			document.documentElement.classList.remove('dark');
		} else {
			document.documentElement.classList.add('dark');
		}

		window.localStorage.setItem('theme', theme || '');

		function sendMessage(message) {
			const iframe = document.querySelector('iframe.giscus-frame');
			if (!iframe) return;
			iframe.contentWindow.postMessage({ giscus: message }, 'https://giscus.app');
		}

		const handleToggleClick = () => {
			const element = document.documentElement;
			element.classList.toggle('dark');

			const isDark = element.classList.contains('dark');
			if (isDark) {
				sendMessage({
					setConfig: {
						theme: 'dark_dimmed'
					}
				});
			} else {
				sendMessage({
					setConfig: {
						theme: 'light'
					}
				});
			}
			localStorage.setItem('theme', isDark ? 'dark' : 'light');
		};
		document.getElementById('themeToggle')?.addEventListener('click', handleToggleClick);
	</script></header><div class="py-8 min-h-[calc(100vh-160px)]" itemprop="mainContentOfPage"><div class="container"><div class="mb-10"><h1 class="text-3xl font-bold mb-2">All Posts Tagged with Web Design</h1></div><div class="mb-12"><h2 class="text-xl font-semibold mb-5 text-zinc-800 dark:text-zinc-200 tracking-tight">2024</h2><div class="space-y-0.5"><div class="flex flex-col sm:flex-row gap-3 sm:items-center border-b py-3 mb-0.5 dark:border-b-zinc-600/70 hover:border-b-zinc-400 dark:hover:border-b-zinc-500 group transition-all duration-200"><div class="text-zinc-600 text-sm w-28 dark:text-zinc-400 shrink-0 group-hover:text-zinc-800 dark:group-hover:text-zinc-200 transition-colors duration-200"><time datetime="2024-11-20T13:30:00.000Z" class="text-zinc-500 dark:text-zinc-400 tabular-nums">Nov 21</time></div><h3 class="font-medium grow group-hover:text-zinc-900 dark:group-hover:text-zinc-100 transition-colors duration-200"><a href="/fresh-new-website/" class="hover:no-underline">That fresh new website feeling</a></h3><div class="flex gap-2 shrink-0"><a class="border border-zinc-300 dark:border-zinc-700 rounded-full
